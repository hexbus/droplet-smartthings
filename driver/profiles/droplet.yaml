name: droplet
components:
  - id: main
    capabilities:
      - id: dictionaryguide60352.dropletflow
        version: 1
      - id: dictionaryguide60352.dropletvolumedelta
        version: 1
      - id: dictionaryguide60352.dropletstatus
        version: 1
      - id: refresh
        version: 1
preferences:
  - name: pairingCode
    title: Droplet pairing code
    description: Paste the letters and numbers from the Droplet app pairing-code screen. This is a text code, not a number.
    required: false
    preferenceType: string
    definition:
      stringType: password
      default: ""
  - name: ipAddress
    title: IP address (optional)
    description: Leave blank for automatic discovery. If needed, enter the Droplet's local IPv4 address.
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 15
      default: ""
  - name: flowUnit
    title: Flow units
    description: Choose liters or US gallons per minute. Review flow-based routine thresholds after changing units.
    required: false
    preferenceType: enumeration
    definition:
      options:
        lpm: Liters/min (L/min)
        gpm: US gallons/min (gal/min)
      default: lpm
