name: droplet
components:
  - id: main
    capabilities:
      - id: dictionaryguide60352.dropletflow
        version: 1
      - id: dictionaryguide60352.dropletvolumedelta
        version: 1
      - id: dictionaryguide60352.dropletstatus
        version: 1
      - id: refresh
        version: 1
preferences:
  - name: pairingCode
    title: Droplet pairing code
    description: Enter the code from Droplet Settings > Smart Home Integrations > Home Assistant Core.
    required: false
    preferenceType: string
    definition:
      stringType: password
      minLength: 0
      maxLength: 255
      default: ""
  - name: ipAddress
    title: IP address (optional)
    description: Leave blank for automatic discovery. If needed, enter the Droplet's local IPv4 address.
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 15
      default: ""
